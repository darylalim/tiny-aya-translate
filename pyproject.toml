[project]
name = "tiny-aya-translate"
version = "0.9.0"
description = "Streamlit application for translation using Cohere Labs Tiny Aya Global on Apple Silicon with MLX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "liteparse>=2.14.4",
    "mlx-lm>=0.31.3",
    "streamlit>=1.63.0",
    "watchdog>=6.0.0",
]

[project.urls]
Repository = "https://github.com/darylalim/tiny-aya-translate"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["."]
